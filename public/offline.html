<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D97706" />
    <title>You're offline · Mountain Bakes ERP</title>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        --orange: #d97706;
        --ink: #1c0f07;
        --muted: #6b5647;
        --cream: #fdf5e6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(160deg, #fff 0%, var(--cream) 100%);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px;
        width: 100%;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(217, 119, 6, 0.18);
        margin: 0 auto 24px;
        display: block;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; font-size: 0.975rem; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #dc2626; animation: pulse 1.6s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      button {
        appearance: none;
        border: 0;
        background: var(--orange);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 12px 26px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.06s ease, background 0.15s ease;
        box-shadow: 0 6px 16px rgba(217, 119, 6, 0.28);
      }
      button:hover { background: #b45309; }
      button:active { transform: translateY(1px); }
      @media (prefers-color-scheme: dark) {
        body { background: #171310; color: #f5efe8; }
        h1 { color: #fdf5e6; }
        .logo { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="Mountain Bakes" />
      <div class="status"><span class="dot"></span> No internet connection</div>
      <h1>You're offline</h1>
      <p>
        Mountain Bakes ERP can't reach the server right now. Check your Wi-Fi or mobile
        data — your work will sync automatically once you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Auto-reload the moment connectivity returns.
      window.addEventListener('online', function () { location.reload(); });
      // Poll as a fallback in case the 'online' event is unreliable.
      setInterval(function () {
        if (navigator.onLine) location.reload();
      }, 5000);
    </script>
  </body>
</html>
